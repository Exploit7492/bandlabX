name: Container

# Builds the SDK image and, on `main` and version tags, publishes it to GHCR.
#
# Every run loads the image locally and runs its default command, so a broken image fails the job.
# Pull requests never push. The first publish needs the owner to allow the workflow to write
# packages — see docs/handover/CONTAINER.md, "Owner steps".
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The image is named bandlabX, not after the repository, and GHCR rejects uppercase
      # paths, so the owner is lowercased. Repository owners are not always lowercase.
      - name: Compute the image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/bandlabx" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      # `load` and `push` cannot be combined: buildx rejects them together. Build once into the
      # local daemon, smoke it, then push the same tags below.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        # Use the first generated tag: it is guaranteed to be one the Build step loaded, whereas
        # metadata-action's `version` output can differ from every tag when several rules match.
        run: SKIP_BUILD=1 IMAGE="$(printf '%s\n' "$TAGS" | head -n1)" ./scripts/container-smoke

      - name: Publish to GHCR
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            echo "Pushing $tag"
            docker push "$tag"
          done <<< "$TAGS"

      - name: Summary
        run: |
          {
            echo "### Container image"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
